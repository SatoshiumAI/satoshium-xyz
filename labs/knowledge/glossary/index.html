<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossary Hub | Satoshium Labs</title>
  <meta name="description" content="Glossary Hub provides canonical terminology for the Satoshium ecosystem." />
  <style>

    .frame-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .frame-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }

    .frame-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .frame-note {
      font-size: 0.85rem;
      color: var(--muted);
    }

.app-frame {
  width: 100%;
  border: 0;
  display: block;
  background: #000;

  height: calc(100vh + 300px); /* more flexible than 130vh */
  overflow: hidden;
}

.app-frame::-webkit-scrollbar {
  display: none;
}
    
  /* OPTIONAL: remove extra page scroll spacing */
  .frame-card {
    overflow: hidden;
  }

  /* OPTIONAL: remove extra page scroll spacing */
  .frame-card {
    overflow: hidden;
  }

     @media (max-width: 900px) {
      .app-frame {
        height: 1100px;
      }

  </style>
</head>
<body>
    <section class="frame-card">
      <div class="frame-top">
      </div>

   <iframe
  class="app-frame"
  src="https://satoshiumai.github.io/satoshium-labs/knowledge/glossary/"
  title="Glossary Hub"
  loading="lazy"
></iframe>
    </section>

</body>
</html>
