<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossary Hub | Satoshium</title>
  <meta name="description" content="Glossary Hub provides canonical terminology for the Satoshium ecosystem." />
  <link rel="icon" type="image/svg+xml" href="https://satoshium.xyz/assets/favicon.svg">
  <link rel="alternate icon" href="https://satoshium.xyz/assets/favicon.ico">
  <link rel="apple-touch-icon" href="https://satoshium.xyz/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#9b6cff">
 
  <!-- TIER 3 — SEO: Open Graph -->
  <meta property="og:title" content="Glossary Hub | Satoshium">
  <meta property="og:description" content="Glossary Hub provides canonical terminology for the Satoshium ecosystem.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://satoshium.xyz/labs/knowledge/glossary/">
  <meta property="og:image" content="https://satoshium.ai/assets/og-glossary.png">
  <meta property="og:site_name" content="Satoshium">
  <meta property="og:locale" content="en_US">
 
  <!-- TIER 3 — SEO: Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Glossary Hub | Satoshium">
  <meta name="twitter:description" content="Glossary Hub provides canonical terminology for the Satoshium ecosystem.">
  <meta name="twitter:image" content="https://satoshium.ai/assets/og-glossary.png">
  <meta name="twitter:site" content="@SatoshiumAI">
 
  <!-- TIER 3 — SEO: canonical URL -->
  <link rel="canonical" href="https://satoshium.xyz/labs/knowledge/glossary/">
 
  <!-- TIER 3 — PERFORMANCE: dns-prefetch for iframe source -->
  <link rel="preconnect" href="https://satoshiumai.github.io" crossorigin>
  <link rel="dns-prefetch" href="https://satoshiumai.github.io">
 
  <style>
    :root{
      --bg:#07090d;
      --panel:#0c1018;
      --text:#e8edf7;
      --muted:#9aa7bd;
      --gold:#d6a34a;
      --gold2:#f4c36a;
      --line:rgba(214,163,74,.18);
    }
 
    *{box-sizing:border-box}
 
    html, body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      /* TIER 3 — UX: smooth scroll */
      scroll-behavior:smooth;
    }
 
    body{
      min-height:100vh;
    }
 
    /* TIER 3 — ACCESSIBILITY: visible keyboard focus ring */
    :focus-visible{
      outline:2px solid var(--gold2);
      outline-offset:3px;
    }
 
    .app-shell{
      width:100%;
      max-width:none;
      margin:0;
      padding:0;
    }
 
    .app-frame{
      width:100%;
      border:0;
      display:block;
      background:#000;
      overflow:hidden;
      height:calc(100vh + 300px);
    }
 
    @media (max-width: 900px){
      .app-frame{
        height:1400px;
      }
    }
 
    /* TIER 3 — ACCESSIBILITY: reduced-motion guard */
    @media (prefers-reduced-motion:reduce){
      html,body{
        scroll-behavior:auto;
      }
    }
  </style>
</head>
<body>
  <!-- TIER 3 — ACCESSIBILITY: id="main-content" for landmark targeting -->
  <main id="main-content" class="app-shell">
    <iframe
      class="app-frame"
      src="https://satoshiumai.github.io/satoshium-labs/knowledge/glossary/"
      title="Satoshium Glossary Hub — canonical terminology reference"
      loading="lazy">
    </iframe>
  </main>
</body>
</html>
