<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossary Hub | Satoshium</title>
  <meta name="description" content="Glossary Hub provides canonical terminology for the Satoshium ecosystem." />
  <style>
    :root{
      --bg:#07090d;
      --panel:#0c1018;
      --text:#e8edf7;
      --muted:#9aa7bd;
      --gold:#d6a34a;
      --gold2:#f4c36a;
      --line:rgba(214,163,74,.18);
    }

    *{box-sizing:border-box}

    html, body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    body{
      min-height:100vh;
    }

    .app-shell{
      width:100%;
      max-width:none;
      margin:0;
      padding:0;
    }

    .app-frame{
      width:100%;
      border:0;
      display:block;
      background:#000;
      overflow:hidden;
      height:calc(100vh + 300px);
    }

    @media (max-width: 900px){
      .app-frame{
        height:1400px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <iframe
      class="app-frame"
      src="https://satoshiumai.github.io/satoshium-labs/knowledge/glossary/"
      title="Glossary Hub"
      loading="lazy">
    </iframe>
  </main>
</body>
</html>
