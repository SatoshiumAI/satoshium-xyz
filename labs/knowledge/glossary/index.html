<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossary Hub | Satoshium Labs</title>
  <meta name="description" content="Glossary Hub provides canonical terminology for the Satoshium ecosystem." />
  <style>
:root{
  --card-wm: url('https://satoshium.link/assets/seal.png');
  --bg:#07090d;
  --panel:#0c1018;
  --text:#e8edf7;
  --muted:#9aa7bd;
  --gold:#d6a34a;
  --gold2:#f4c36a;
  --line:rgba(214,163,74,.18);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
body{
 padding-top:80px;
}
.wrap{
  max-width:980px;
  margin:0 auto;
  padding:0 18px;
}

.wrap.content{
  opacity:0;
  transform:translateY(6px);
  animation:pageEnter .28s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes pageEnter{
 to{
 opacity:1;
 transform:translateY(0);
 }
}
  
.content{
  padding:40px 0 60px;
}

h1{
  font-size:30px;
  color:var(--gold2);
  margin-bottom:10px;
}

h2{
  font-size:20px;
  color:var(--gold2);
}

.muted{
  color:var(--muted);
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(214,163,74,.08);
  color:var(--gold2);
  font-size:12px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:22px;
  margin-top:28px;
}

.reflection{
 margin-top:40px;
 margin-bottom:40px;
 color:var(--muted);
}
  
.card{
  position:relative;
  overflow:hidden;

  background:linear-gradient(
    to bottom right,
    rgba(12,16,24,.94),
    rgba(12,16,24,.88)
  );

  border:1px solid var(--line);
  border-radius:16px;

  padding:22px;

  box-shadow:
  0 0 0 1px rgba(214,163,74,.08),
  0 20px 50px rgba(0,0,0,.45);

  transition:transform .15s ease, box-shadow .15s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:
  0 0 0 1px rgba(214,163,74,.12),
  0 24px 60px rgba(0,0,0,.55);
}

.card::before{
  content:"";
  position:absolute;
  inset:-60px;

  background-image:var(--card-wm);
  background-repeat:no-repeat;
  background-size:min(720px,70vw);
  background-position:right -140px center;

  opacity:0.03;
  filter:blur(1px);

  pointer-events:none;
}

.card h2{
  margin-top:0;
}

.card p{
  color:var(--muted);
}

.card a{
  display:inline-block;
  margin-top:12px;
  font-size:13px;
  color:var(--gold2);
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}
  
.card a:hover{
  color:var(--gold);
}

    .frame-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .frame-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }

    .frame-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .frame-note {
      font-size: 0.85rem;
      color: var(--muted);
    }

.app-frame {
  width: 100%;
  border: 0;
  display: block;
  background: #000;

  height: calc(100vh + 300px); /* more flexible than 130vh */
  overflow: hidden;
}

.app-frame::-webkit-scrollbar {
  display: none;
}
    
  /* OPTIONAL: remove extra page scroll spacing */
  .frame-card {
    overflow: hidden;
  }

  /* OPTIONAL: remove extra page scroll spacing */
  .frame-card {
    overflow: hidden;
  }

     @media (max-width: 900px) {
      .app-frame {
        height: 1100px;
      }

  </style>
</head>
<body>
    <section class="frame-card">
      <div class="frame-top">
      </div>

   <iframe
  class="app-frame"
  src="https://satoshiumai.github.io/satoshium-labs/knowledge/glossary/"
  title="Glossary Hub"
  loading="lazy"
></iframe>
    </section>

</body>
</html>
